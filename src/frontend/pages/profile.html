      <a href="./new-athlete.html" class="nav-item">

      <a href="./test-list.html" class="nav-item">

    <button id="logoutBtn" class="logout-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 17L21 12M21 12L16 7M21 12H9"/><path d="M9 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H9"/></svg>
      Logout
    </button>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h1>Profile</h1>
        <p>Manage your personal information and password</p>
      </div>
    </div>

    <div id="messageBox"></div>

    <!-- INFO CARD -->
    <div class="profile-header-card">
      <div class="profile-avatar" id="profileAvatar">–</div>
      <div>
        <div class="profile-name" id="profileName">Loading...</div>
        <div class="profile-email" id="profileEmail"></div>
        <div class="profile-meta" id="profileMeta"></div>
      </div>
    </div>

    <!-- EDIT PROFILE -->
    <section class="panel">
      <div class="panel-header">
        <h3>Personal Information</h3>
      </div>
      <form id="profileForm">
        <div class="form-grid">
          <div class="field">
            <label for="editName">Full Name</label>
            <input type="text" id="editName" required/>
          </div>
          <div class="field">
            <label for="editEmail">Email</label>
            <input type="email" id="editEmail" required/>
          </div>
        </div>
        <div class="form-actions" style="margin-top:16px;">
          <button type="submit" id="saveProfileBtn" class="btn-primary">💾 Save Changes</button>
        </div>
      </form>
    </section>

    <!-- CHANGE PASSWORD -->
    <section class="panel">
      <div class="panel-header">
        <h3>Change Password</h3>
      </div>
      <form id="passwordForm">
        <div class="form-grid">
          <div class="field" style="grid-column:1/-1;">
            <label for="currentPassword">Current Password</label>
            <input type="password" id="currentPassword" placeholder="Your current password" required/>
          </div>
          <div class="field">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" placeholder="Min. 6 characters" required/>
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" placeholder="Repeat new password" required/>
          </div>
        </div>
        <div class="form-actions" style="margin-top:16px;">
          <button type="submit" id="savePasswordBtn" class="btn-primary">🔒 Update Password</button>
        </div>
      </form>
    </section>

  </main>
</div>
<script type="module" src="../js/profile.js"></script>
</body>
</html>
