  <button id="logoutBtn" class="logout-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 17L21 12M21 12L16 7M21 12H9"/><path d="M9 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H9"/></svg>
    Logout
    </button>

  <!-- MAIN -->
  <main class="main">
    <div class="page-header">
      <div>
        <h1>Coaches</h1>
        <p>Manage system users and their access</p>
      </div>
      <div class="header-actions">
        <button id="refreshBtn" class="refresh-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          Refresh
        </button>
        <button id="addCoachBtn" class="new-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Add Coach
        </button>
      </div>
    </div>

    <div id="messageBox"></div>

    <section class="panel">
      <div class="panel-header">
        <h3>Coaches List</h3>
        <span class="panel-badge" id="totalBadge">0 Coaches</span>
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Tests Applied</th>
              <th>Member Since</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="coachesTableBody">
            <tr><td colspan="6" class="empty-row">Loading coaches...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<!-- ADD COACH MODAL -->
<div id="addModal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h3>Add New Coach</h3>
      <button class="modal-close" data-close="addModal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <form id="addCoachForm">
      <div class="form-grid">
        <div class="field" style="grid-column:1/-1;">
          <label for="newName">Full Name</label>
          <input type="text" id="newName" placeholder="Coach full name" required/>
        </div>
        <div class="field" style="grid-column:1/-1;">
          <label for="newEmail">Email</label>
          <input type="email" id="newEmail" placeholder="coach@email.com" required/>
        </div>
        <div class="field">
          <label for="newPassword">Password</label>
          <input type="password" id="newPassword" placeholder="Min. 6 characters" required/>
        </div>
        <div class="field">
          <label for="newConfirmPassword">Confirm Password</label>
          <input type="password" id="newConfirmPassword" placeholder="Repeat password" required/>
        </div>
      </div>
      <div class="modal-actions">
        <button type="submit" id="addCoachBtn2" class="btn-primary">➕ Add Coach</button>
        <button type="button" class="btn-secondary" data-close="addModal">Cancel</button>
      </div>
    </form>
  </div>
</div>

<!-- PROFILE MODAL -->
<div id="profileModal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <div>
        <h3 id="modalCoachName">Coach Profile</h3>
        <span id="modalCoachEmail" style="font-size:12px;color:var(--text-muted);"></span>
      </div>
      <button class="modal-close" data-close="profileModal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-stats" id="modalStats"></div>
    <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);margin-bottom:12px;">Tests Applied</div>
    <div id="modalTests" class="modal-tests"></div>
    <div class="modal-actions">
      <button class="btn-secondary" data-close="profileModal">Close</button>
    </div>
  </div>
</div>

<script type="module" src="../js/coaches.js"></script>
</body>
</html>
