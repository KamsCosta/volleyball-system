<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!-- ícone do sistema e instalação no celular (gerados por tools/gerar_icones.py) -->
  <link rel="icon" href="../assets/icons/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="../assets/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-title" content="Volleyball Performance" />
  <title>Reset Password – Volleyball Performance</title>
  <link rel="stylesheet" href="../css/login.css"/>
</head>
<body>
  <div class="page">
    <div class="bg login"></div>
    <div class="overlay"></div>

    <div class="card">
      <h2>Reset Password</h2>
      <p style="color:rgba(255,255,255,0.7);font-size:0.9rem;margin-bottom:1.5rem;">
        Enter your new password below.
      </p>

      <form id="resetForm" class="form">
        <div class="input-row">
          <div class="input-icon">🔒</div>
          <input type="password" id="newPassword" placeholder="New password" required/>
        </div>

        <div class="input-row">
          <div class="input-icon">🔑</div>
          <input type="password" id="confirmPassword" placeholder="Confirm new password" required/>
        </div>

        <button type="submit" id="submitBtn" class="btn">Reset Password</button>

        <div class="links">
          <a href="./login.html">Back to Login</a>
        </div>
      </form>

      <div id="messageBox"></div>
    </div>
  </div>

  <script type="module" src="../js/reset-password.js"></script>
</body>
</html>
