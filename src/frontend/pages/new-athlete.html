  <button id="logoutBtn" class="logout-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 17L21 12M21 12L16 7M21 12H9"/><path d="M9 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H9"/></svg>
      Logout
    </button>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="page-header">
      <div>
        <h1>New Athlete</h1>
        <p>Register a new athlete in the system</p>
      </div>
      <a href="./players.html" class="refresh-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Back to Athletes
      </a>
    </div>

    <div id="messageBox"></div>

    <section class="panel">
      <div class="panel-header">
        <h3>Athlete Information</h3>
        <span class="panel-badge">New</span>
      </div>
      <form id="newAthleteForm">
        <div class="form-grid">
          <div class="field">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Athlete full name" required/>
          </div>
          <div class="field">
            <label for="position">Position</label>
            <input type="text" id="position" placeholder="Ex: Setter, Libero, Opposite" required/>
          </div>
          <div class="field">
            <label for="number">Number</label>
            <input type="number" id="number" min="1" max="99" placeholder="Jersey number (1–99)" required/>
          </div>
          <div class="field">
            <label for="height">Height (cm)</label>
            <input type="number" id="height" min="100" max="250" placeholder="Height in cm" required/>
          </div>
        </div>
        <div class="form-actions">
          <button type="submit" id="submitBtn" class="btn-primary">➕ Save Athlete</button>
          <a href="./players.html" class="btn-secondary">Cancel</a>
        </div>
      </form>
    </section>
  </main>
</div>

<script type="module" src="../js/new-athlete.js"></script>

</html>
