<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password – Volleyball Performance</title>
  <link rel="stylesheet" href="../css/login.css"/>
</head>
<body>
  <div class="page">
    <div class="bg login"></div>
    <div class="overlay"></div>

    <div class="card">
      <h2 style="margin-bottom:1.2rem;font-size:1.2rem;">Forgot Password</h2>
      <p style="color:rgba(255,255,255,0.7);font-size:0.9rem;margin-bottom:1.5rem;">
        Enter your email and we'll send you a reset link.
      </p>

      <form id="forgotForm" class="form">
        <div class="input-row">
          <div class="input-icon">📧</div>
          <input type="email" id="email" placeholder="Your e-mail" required/>
        </div>

        <button type="submit" id="submitBtn" class="btn">Send Reset Link</button>

        <div class="links">
          <a href="./login.html">Back to Login</a>
        </div>
      </form>

      <div id="messageBox"></div>
    </div>
  </div>

  <script type="module" src="../js/forgot-password.js"></script>
</body>
</html>
