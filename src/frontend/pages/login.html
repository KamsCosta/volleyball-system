<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- ícone do sistema e instalação no celular (gerados por tools/gerar_icones.py) -->
  <link rel="icon" href="../assets/icons/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="../assets/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-title" content="Volleyball Performance" />
  <!-- prévia do link ao compartilhar (WhatsApp, Telegram...).
       __PUBLIC_ORIGIN__ é trocado pelo endereço público pelo backend (Program.cs) -->
  <meta name="description" content="Technical assessment for volleyball athletes." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Volleyball Performance" />
  <meta property="og:title" content="Volleyball Performance" />
  <meta property="og:description" content="Technical assessment for volleyball athletes." />
  <meta property="og:url" content="__PUBLIC_ORIGIN__/login" />
  <meta property="og:image" content="__PUBLIC_ORIGIN__/assets/icons/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>Login – Volleyball Performance</title>
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body>
  <div class="page">
    <div class="bg login"></div>
    <div class="overlay"></div>

    <div class="card">
      <div class="tabs">
        <button type="button" class="tab active">Login</button>
        <a href="./sign.html" class="tab">Sign Up</a>
      </div>

      <h2 class="form-title">Welcome Back</h2>
      <p class="form-subtitle">Login to access your volleyball dashboard</p>

      <form id="formLogin" class="form">
        <div class="input-row">
          <div class="input-icon">📧</div>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="E-mail"
            required
          />
        </div>

        <div class="input-row">
          <div class="input-icon">🔒</div>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Password"
            required
          />
        </div>

        <button type="submit" class="btn">Login</button>

        <div class="links">
          <a href="./forgot-password.html">Forgot your password?</a>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="../js/login.js"></script>
</body>
</html>
