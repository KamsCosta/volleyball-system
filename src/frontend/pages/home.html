<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Home – Volleyball Performance</title>
  <link rel="stylesheet" href="../css/home.css"/>
</head>
<body>
<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <span class="brand-emoji">🏐</span>
        <span class="brand-name">Volleyball<br><strong>Performance</strong></span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="./home.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3L21 9.5V20C21 20.55 20.55 21 20 21H15V15H9V21H4C3.45 21 3 20.55 3 20V9.5Z"/></svg>
        Home
      </a>
      <a href="./dashboard.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Dashboard
      </a>
      <a href="./players.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="7" r="4"/><path d="M3 21V19C3 16.79 4.79 15 7 15H11C13.21 15 15 16.79 15 19V21"/><path d="M16 3.13C17.76 3.58 19 5.18 19 7.05"/><path d="M21 21V19C21 17.14 19.76 15.54 18 15.09"/></svg>
        Athletes
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 5H7C5.9 5 5 5.9 5 7V19C5 20.1 5.9 21 7 21H17C18.1 21 19 20.1 19 19V7C19 5.9 18.1 5 17 5H15"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12H15M9 16H13"/></svg>
        Test List
      </a>
      <a href="./players.html#playerFormSection" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20C4 17.79 7.58 16 12 16C16.42 16 20 17.79 20 20"/><path d="M19 3V7M17 5H21"/></svg>
        New Athlete
      </a>
      <div class="nav-divider"></div>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </a>
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20C4 17.79 7.58 16 12 16C16.42 16 20 17.79 20 20"/></svg>
        Profile
      </a>
    </nav>
    <button id="logoutBtn" class="logout-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 17L21 12M21 12L16 7M21 12H9"/><path d="M9 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H9"/></svg>
      Logout
    </button>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- HERO -->
    <div class="hero">
      <div class="hero-img"></div>
      <div class="hero-gradient"></div>
      <div class="hero-content">
        <div>
          <h1>Home</h1>
          <p>Overview of the latest activities in the system</p>
        </div>
        <div class="header-badge">
          <span class="badge-dot"></span>
          System Active
        </div>
      </div>
    </div>

    <!-- CONTENT -->
    <div class="content">

      <!-- RESUMO RÁPIDO -->
      <div class="summary-grid">
        <div class="summary-card">
          <div class="summary-icon athletes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="7" r="4"/><path d="M3 21V19C3 16.79 4.79 15 7 15H11C13.21 15 15 16.79 15 19V21"/><path d="M16 3.13C17.76 3.58 19 5.18 19 7.05"/><path d="M21 21V19C21 17.14 19.76 15.54 18 15.09"/></svg>
          </div>
          <div>
            <span class="summary-label">Total Athletes</span>
            <h2 class="summary-value" id="totalAthletes">–</h2>
          </div>
        </div>
        <div class="summary-card">
          <div class="summary-icon recent">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7V12L15 14"/></svg>
          </div>
          <div>
            <span class="summary-label">Last Registered</span>
            <h2 class="summary-value" id="lastRegistered">–</h2>
          </div>
        </div>
        <div class="summary-card">
          <div class="summary-icon positions">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 5H7C5.9 5 5 5.9 5 7V19C5 20.1 5.9 21 7 21H17C18.1 21 19 20.1 19 19V7C19 5.9 18.1 5 17 5H15"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12H15M9 16H13"/></svg>
          </div>
          <div>
            <span class="summary-label">Positions</span>
            <h2 class="summary-value" id="totalPositions">–</h2>
          </div>
        </div>
      </div>

      <!-- ÚLTIMAS ATIVIDADES -->
      <div class="panel">
        <div class="panel-header">
          <h3>Recent Activity</h3>
          <a href="./players.html" class="panel-link">View all athletes →</a>
        </div>
        <div id="activityFeed" class="activity-feed">
          <div class="activity-loading">Loading activities...</div>
        </div>
      </div>

    </div>
  </main>
</div>

<script type="module" src="../js/home.js"></script>
</body>
</html>
